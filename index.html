<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raymond Rodarte</title>
<style>
  :root {
    --ink:   #1a1a1a;
    --muted: #6b7280;
    --line:  #e7e5e4;
    --card:  #ffffff;
    --bg:    #faf9f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 48px 20px 64px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
  }

  .avatar {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #1a1a1a;
    color: #fff;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .tagline {
    margin: 0 0 36px;
    color: var(--muted);
    font-size: 15px;
  }

  .section-label {
    margin: 0 0 12px;
    color: var(--muted);
    font-size: 13px;
    text-align: left;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .link-btn:hover {
    border-color: #d6d3d1;
    transform: translateY(-1px);
  }

  .link-btn:focus-visible {
    outline: 2px solid #1a1a1a;
    outline-offset: 2px;
  }

  .icon {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    border-radius: 10px;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-blue   { background: #dbeafe; }
  .icon-green  { background: #dcfce7; }
  .icon-purple { background: #ede9fe; }
  .icon-orange { background: #fff7ed; }
  .icon-amber  { background: #f3e4cf; }

  .label {
    flex: 1;
    text-align: left;
    font-size: 16px;
    font-weight: 500;
  }

  .arrow {
    color: #c4c0bb;
    font-size: 20px;
    line-height: 1;
  }

  footer {
    margin-top: 44px;
    color: #a8a29e;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    .link-btn { transition: none; }
    .link-btn:hover { transform: none; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="avatar">RR</div>

    <h1>Raymond Rodarte</h1>
    <p class="tagline">Based in Ventura, CA · Dad · builder of things</p>

    <p class="section-label">Links</p>

    <div class="links">

      <a href="/smoke" class="link-btn">
        <span class="icon icon-amber">🚬</span>
        <span class="label">Smoke Journal</span>
        <span class="arrow">›</span>
      </a>

      <a href="https://homepage.flowersrodarte.com" class="link-btn" target="_blank" rel="noopener">
        <span class="icon icon-blue">🖥️</span>
        <span class="label">Homelab</span>
        <span class="arrow">›</span>
      </a>

      <a href="https://byndwellness.com" class="link-btn" target="_blank" rel="noopener">
        <span class="icon icon-green">🌿</span>
        <span class="label">BYND Wellness</span>
        <span class="arrow">›</span>
      </a>

    </div>

    <footer>flowersrodarte.com</footer>

  </div>

</body>
</html>
